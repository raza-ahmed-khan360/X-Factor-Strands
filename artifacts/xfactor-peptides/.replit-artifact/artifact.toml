kind = "web"
previewPath = "/"
title = "X Factor Peptides"
version = "1.0.0"
id = "artifacts/xfactor-peptides"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21842

[services.development]
run = "pnpm --filter @workspace/xfactor-peptides run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/xfactor-peptides", "run", "build" ]
serve = "static"
publicDir = "artifacts/xfactor-peptides/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21842"
BASE_PATH = "/"
